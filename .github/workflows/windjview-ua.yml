name: WinDjView-UA build

# Builds WinDjView.exe + WinDjViewUA.dll (x64 and x86) with Visual Studio and the NSIS installer.
# A tag v<version> (e.g. v2.1.1) also attaches the installer and SHA256SUMS.txt to a GitHub Release.
# Raising version.txt is done separately (see docs/RELEASE.md).
# Commits that change only version.txt or documentation do not start a build (tags always do).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['version.txt', 'docs/**', '**.md']
  pull_request:
    paths-ignore: ['version.txt', 'docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach files to a GitHub Release on v* tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build program and installer
        shell: pwsh
        run: |
          $env:Path += ';C:\Program Files (x86)\NSIS'
          ./installer/build-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: WinDjView-UA
          path: installer/dist/*

      - name: Release notes (docs/releases/<tag>.md or the changes.txt section)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          ./installer/release-notes.ps1 -Tag "${{ github.ref_name }}" -Out release-notes.md
          "RELEASE_VERSION=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Attach to the GitHub Release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: WinDjView-UA ${{ env.RELEASE_VERSION }}
          body_path: release-notes.md
          files: installer/dist/*
