name: Ukrainian localization

on:
  push:
    branches: [main]
    tags: ['ua-v*']
    paths:
      - 'windjview/Languages/Ukrainian/**'
      - 'installer/**'
      - '.github/workflows/ukrainian-localization.yml'
  pull_request:
    paths:
      - 'windjview/Languages/Ukrainian/**'
      - 'installer/**'
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach files to a GitHub Release on ua-v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (MinGW-w64, NSIS, pefile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 nsis python3-pefile

      # Builds installer/build/{x64,x86}/WinDjViewUA.dll, checks them (verify_dll.py) and builds the
      # language-pack installer. The full installer is skipped here: it needs the official WinDjView.exe,
      # which is not stored in the repository (see installer/bin/README.txt).
      - name: Build language DLLs and the language-pack installer
        run: installer/tools/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: WinDjView-Ukrainian
          path: installer/dist/*

      - name: Attach to the GitHub Release (ua-v* tags)
        if: startsWith(github.ref, 'refs/tags/ua-v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/*
